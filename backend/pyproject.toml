[project]
name = "telecom-cs-backend"
version = "0.1.0"
description = "电信客服 Agent v1 后端（FastAPI + LangChain 模块化单体）"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "bcrypt>=5.0.0",
    "fastapi>=0.128.8",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "sqlite-vec>=0.1.6",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.39.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: HTTP/WS 集成 seam 测试（PRD 测试决策 › HTTP 集成 seam / WS 事件 seam）",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes；I: isort；UP: pyupgrade；
# B: bugbear；C4: comprehensions；SIM: simplify
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
# 默认风格（双引号、行宽 100）

[tool.mypy]
# mypy 最低支持 3.10；代码本体仍兼容 requires-python>=3.9，此处仅作类型检查目标版本
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
