# 电信客服 Agent v1 — nginx 配置（Windows 裸机部署）
#
# 对应：ADR 0006（部署形态与 Monorepo）/ F0 循环7（issue #2 验收 7）
#
# 职责：
#   - 托管前端静态产物（customer-web / agent-console）
#   - 反代 /api/ 与 /ws 到后端 uvicorn（127.0.0.1:8000）
#
# 端口约定（本切片约定，ADR 0006 未指定）：
#   80   → 用户端 customer-web
#   8081 → 坐席工作台 agent-console
#   8000 → uvicorn 后端（仅本机，nginx 反代对外，不直接暴露）
#
# 用法（Windows）：
#   1. 下载 nginx for Windows（http://nginx.org/en/download.html），解压到任意目录
#   2. 用本文件替换 <nginx>/conf/nginx.conf（或在其 http 块内 include 本文件）
#   3. 调整下方 root 路径为前端 dist 的实际绝对路径（见注释）
#   4. 构建前端：pnpm --filter customer-web build && pnpm --filter agent-console build
#   5. 启动后端：powershell -File deploy/start_backend.ps1
#   6. 启动 nginx：<nginx>\nginx.exe（重载配置：nginx -s reload）
#
# 注意：root 路径用相对 nginx prefix 的写法仅作示意；生产请改为绝对路径，
#       例如 root E:/sjc/开源代码/agent_text2/frontend/customer/dist;

# 后端上游（uvicorn 单进程，ADR 0006）
upstream backend_uvicorn {
    server 127.0.0.1:8000;
}

# ---------- 用户端 customer-web ----------
server {
    listen 80;
    server_name _;

    root ../frontend/customer/dist;
    index index.html;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代
    # proxy_pass 尾斜杠：`/api/...` → 后端 `/...`（后端路由无 /api 前缀，PRD › API 契约）
    location /api/ {
        proxy_pass http://backend_uvicorn/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反代（/ws 握手与流式帧）
    location /ws {
        proxy_pass http://backend_uvicorn;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# ---------- 坐席工作台 agent-console ----------
server {
    listen 8081;
    server_name _;

    root ../frontend/agent/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代（同 customer-web：尾斜杠剥 /api/ 前缀）
    location /api/ {
        proxy_pass http://backend_uvicorn/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend_uvicorn;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
